name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B="https://app.jackrabbitclass.com/jr3.0/Openings"
          O="OrgID=531495"
          echo "=== raw SF row (full html of first 2 data rows)"
          curl -sS "$B/OpeningsJS?$O&Loc=SF&showcols=Location" | grep -o '<tbody>.*' | head -c 2500; echo
          echo "=== attributes/links present in rows"
          curl -sS "$B/OpeningsJS?$O&Loc=SF" | grep -oE '(href|onclick|data-[a-z]+|id)=[^ >]{0,80}' | sed 's/[0-9]\{3,\}/N/g' | sort | uniq -c | sort -rn | head -20
          echo "=== JSON endpoint"
          for p in OpeningsJson OpeningsJSON; do
            curl -sS -o j.txt -w "$p %{http_code} %{content_type} %{size_download}\n" "$B/$p?$O&Loc=SF"
            head -c 1500 j.txt; echo
          done
          echo "=== row counts for full-class params"
          for q in "" "&hidefull=0" "&hidefull=false" "&showfull=1" "&ShowFull=Y" "&IncludeFull=1" "&status=all" "&Closed=1" "&showClosed=1" "&OpeningsOnly=0"; do
            n=$(curl -sS "$B/OpeningsJS?$O&Loc=SF&showcols=Location$q" | grep -o 'data-title="Class"' | wc -l)
            z=$(curl -sS "$B/OpeningsJS?$O&Loc=SF$q" | grep -oE 'data-title="Openings"[^>]*> *0 *<' | wc -l)
            echo "q='$q' rows=$n zero_openings=$z"
          done
          echo "=== portal page network requests (logged out)"
          curl -sS -o p.html -w "%{http_code}\n" "https://app.jackrabbitclass.com/jr4.0/ParentPortal/Classes?OrgID=531495"
          grep -oE '(src|href)="[^"]+\.js[^"]*"' p.html | head -20
          grep -oiE '["/][A-Za-z0-9_/]*(api|Get|Class)[A-Za-z0-9_/]*' p.html | sort -u | head -40

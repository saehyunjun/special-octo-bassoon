name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B="https://app.jackrabbitclass.com/jr3.0/Openings/OpeningsJS?OrgID=531495"
          for q in "" "&showcols=Location" "&showcols=Loc" "&showcols=Location,Room,Instructor,Cat1,Cat2,Cat3" "&Loc=SF" "&Loc=San%20Francisco"; do
            echo "=== $q"
            curl -sS "$B$q" > o.js
            wc -c < o.js
            grep -o '<th[^>]*>[^<]*' o.js | sed 's/<th[^>]*>//' | sort | uniq -c | head -30
            grep -o '<td[^>]*data-title=\\\?"[A-Za-z ]*' o.js | sed 's/.*data-title=\\\?"//' | sort | uniq -c | head -30
          done
          echo "=== one raw row"
          curl -sS "$B&showcols=Location" | grep -o '<tr.*' | head -c 3000

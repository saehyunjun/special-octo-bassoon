name: Jackrabbit class monitor

on:
  schedule:
    - cron: "2,17,32,47 * * * *" # every 15 minutes
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test alert even if no class matches"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: class-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check class listing
        run: python check_classes.py

      - name: Notify on match
        env:
          GH_TOKEN: ${{ github.token }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TEST_ALERT: ${{ inputs.test_alert }}
        run: python notify.py
